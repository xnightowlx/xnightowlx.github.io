<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Owl Boxing</title>
    <style>
      :root {
        --bg: #11131a;
        --panel: #1a1f2b;
        --panel-2: #232a39;
        --text: #f0f3ff;
        --accent: #ff3b3b;
        --accent-2: #3bc7ff;
        --ok: #66d17a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #1f2a44, var(--bg) 55%);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .game-shell {
        width: min(920px, 100%);
        background: linear-gradient(180deg, var(--panel), #141925);
        border: 1px solid #2b3348;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      .hud {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 16px;
        align-items: center;
        padding: 16px;
        background: #121725;
        border-bottom: 1px solid #2b3348;
      }

      .fighter-panel { display: grid; gap: 6px; }
      .fighter-panel.right { text-align: right; }
      .label { font-size: 0.8rem; color: #9ca7c7; letter-spacing: 0.05em; text-transform: uppercase; }

      .health-track {
        width: 100%;
        height: 14px;
        background: #0b0f18;
        border-radius: 999px;
        border: 1px solid #303a55;
        overflow: hidden;
      }

      .health-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ff4f4f, #ffab4f);
        transition: width 120ms linear;
      }

      .clock-wrap {
        display: grid;
        place-items: center;
        gap: 8px;
      }

      #clock {
        background: #0d1321;
        border: 1px solid #3b4868;
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        min-width: 90px;
        text-align: center;
      }

      #arena {
        width: 100%;
        height: auto;
        display: block;
        background:
          linear-gradient(180deg, #2f3650 0 58%, #172032 58%),
          linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        image-rendering: pixelated;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px 18px;
        border-top: 1px solid #2b3348;
        background: #141a29;
      }

      .keys { color: #9ca7c7; font-size: 0.95rem; }

      button {
        border: 0;
        background: linear-gradient(180deg, #3bc7ff, #2c8df5);
        color: white;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
      }

      button:hover { filter: brightness(1.08); }

      .message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 180ms;
      }

      .message.visible { opacity: 1; }

      .message-card {
        background: rgba(8, 12, 20, 0.88);
        border: 1px solid #3b4868;
        border-radius: 16px;
        padding: 22px 28px;
        text-align: center;
      }

      .message-card h2 { margin: 0 0 8px; font-size: 1.7rem; }
      .message-card p { margin: 0; color: #b9c3df; }

      .arena-wrap { position: relative; }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <section class="fighter-panel">
          <span class="label">You</span>
          <div class="health-track"><div class="health-fill" id="player-health"></div></div>
          <strong id="player-score">Wins: 0</strong>
        </section>
        <section class="clock-wrap">
          <span class="label">Round Time</span>
          <div id="clock">60</div>
        </section>
        <section class="fighter-panel right">
          <span class="label">CPU Fighter</span>
          <div class="health-track"><div class="health-fill" id="cpu-health"></div></div>
          <strong id="cpu-score">Wins: 0</strong>
        </section>
      </header>

      <div class="arena-wrap">
        <canvas id="arena" width="920" height="460"></canvas>
        <div class="message" id="message">
          <div class="message-card">
            <h2 id="message-title">Fight!</h2>
            <p id="message-text">Knock out the CPU fighter to win the round.</p>
          </div>
        </div>
      </div>

      <footer class="controls">
        <div class="keys">
          Move: <b>A / D</b> or <b>← / →</b> &nbsp;•&nbsp; Punch: <b>J</b> &nbsp;•&nbsp; Block: <b>K</b>
        </div>
        <button id="restart" type="button">Restart Match</button>
      </footer>
    </main>

    <script>
      const canvas = document.getElementById("arena");
      const ctx = canvas.getContext("2d");
      const playerHealthEl = document.getElementById("player-health");
      const cpuHealthEl = document.getElementById("cpu-health");
      const clockEl = document.getElementById("clock");
      const playerScoreEl = document.getElementById("player-score");
      const cpuScoreEl = document.getElementById("cpu-score");
      const restartBtn = document.getElementById("restart");
      const messageBox = document.getElementById("message");
      const messageTitle = document.getElementById("message-title");
      const messageText = document.getElementById("message-text");

      const groundY = canvas.height - 82;
      const roundLength = 60;

      const state = {
        playerWins: 0,
        cpuWins: 0,
        timer: roundLength,
        over: false,
        lastFrame: 0,
      };

      const keys = new Set();

      const fighterBase = {
        width: 70,
        height: 130,
        speed: 4.2,
        punchCooldown: 0,
        punchDuration: 0,
        blockDuration: 0,
        hurtDuration: 0,
      };

      const player = {
        ...fighterBase,
        x: 220,
        y: groundY - fighterBase.height,
        color: "#3bc7ff",
        health: 100,
        facing: 1,
      };

      const cpu = {
        ...fighterBase,
        x: 630,
        y: groundY - fighterBase.height,
        color: "#ff5959",
        health: 100,
        facing: -1,
        aiDelay: 0,
      };

      function resetRound() {
        player.x = 220;
        cpu.x = 630;
        player.health = 100;
        cpu.health = 100;
        state.timer = roundLength;
        state.over = false;
        state.lastFrame = performance.now();
        player.punchCooldown = cpu.punchCooldown = 0;
        player.punchDuration = cpu.punchDuration = 0;
        player.blockDuration = cpu.blockDuration = 0;
        hideMessage();
      }

      function endRound(title, subtitle) {
        state.over = true;
        showMessage(title, subtitle);
      }

      function showMessage(title, subtitle) {
        messageTitle.textContent = title;
        messageText.textContent = subtitle;
        messageBox.classList.add("visible");
      }

      function hideMessage() {
        messageBox.classList.remove("visible");
      }

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function processInput() {
        if (state.over) return;

        const left = keys.has("arrowleft") || keys.has("a");
        const right = keys.has("arrowright") || keys.has("d");

        if (left && !right) player.x -= player.speed;
        if (right && !left) player.x += player.speed;

        player.x = clamp(player.x, 20, canvas.width - player.width - 20);

        if (keys.has("j")) punch(player, cpu);
        if (keys.has("k") && player.blockDuration <= 0) player.blockDuration = 8;
      }

      function cpuLogic() {
        if (state.over) return;

        const dist = player.x - cpu.x;
        cpu.facing = dist > 0 ? 1 : -1;
        cpu.aiDelay -= 1;

        const desired = clamp(player.x - cpu.facing * 95, 20, canvas.width - cpu.width - 20);

        if (Math.abs(desired - cpu.x) > 8) {
          cpu.x += Math.sign(desired - cpu.x) * cpu.speed * 0.82;
        }

        if (cpu.aiDelay <= 0) {
          const shouldBlock = Math.random() < 0.18;
          if (shouldBlock && cpu.blockDuration <= 0) {
            cpu.blockDuration = 10;
          } else {
            punch(cpu, player);
          }
          cpu.aiDelay = 18 + Math.random() * 20;
        }
      }

      function punch(attacker, defender) {
        if (attacker.punchCooldown > 0 || attacker.blockDuration > 0 || attacker.hurtDuration > 0) return;
        attacker.punchDuration = 8;
        attacker.punchCooldown = 14;

        const attackReach = 86;
        const hitWindow = attacker.facing === 1
          ? defender.x - (attacker.x + attacker.width)
          : attacker.x - (defender.x + defender.width);

        if (hitWindow >= -20 && hitWindow <= attackReach) {
          const blocked = defender.blockDuration > 0;
          const damage = blocked ? 3 : 9 + Math.random() * 4;
          defender.health = clamp(defender.health - damage, 0, 100);
          defender.hurtDuration = blocked ? 4 : 7;
        }
      }

      function updateTimers() {
        for (const fighter of [player, cpu]) {
          fighter.punchCooldown = Math.max(0, fighter.punchCooldown - 1);
          fighter.punchDuration = Math.max(0, fighter.punchDuration - 1);
          fighter.blockDuration = Math.max(0, fighter.blockDuration - 1);
          fighter.hurtDuration = Math.max(0, fighter.hurtDuration - 1);
        }
      }

      function checkWin() {
        if (state.over) return;

        if (player.health <= 0 || cpu.health <= 0 || state.timer <= 0) {
          if (player.health === cpu.health) {
            endRound("Draw!", "Both fighters are evenly matched. Press Restart Match.");
          } else if (player.health > cpu.health) {
            state.playerWins += 1;
            endRound("You Win!", "Great footwork and timing. Press Restart Match for another round.");
          } else {
            state.cpuWins += 1;
            endRound("CPU Wins", "Keep your guard up and counter with J. Press Restart Match.");
          }
          updateHud();
        }
      }

      function updateHud() {
        playerHealthEl.style.width = `${player.health}%`;
        cpuHealthEl.style.width = `${cpu.health}%`;
        playerScoreEl.textContent = `Wins: ${state.playerWins}`;
        cpuScoreEl.textContent = `Wins: ${state.cpuWins}`;
        clockEl.textContent = `${Math.ceil(state.timer)}`;
      }

      function drawRing() {
        ctx.save();
        ctx.fillStyle = "#203355";
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 4;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.moveTo(0, 115 + i * 36);
          ctx.lineTo(canvas.width, 115 + i * 36);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawFighter(f, isPlayer) {
        const bob = Math.sin(performance.now() * 0.01 + (isPlayer ? 0 : 2)) * 2;
        const punchOffset = f.punchDuration > 0 ? f.facing * 18 : 0;
        const guardUp = f.blockDuration > 0;
        const hurtTint = f.hurtDuration > 0 ? "#ffffff" : f.color;

        const x = Math.round(f.x);
        const y = Math.round(f.y + bob);

        ctx.save();

        ctx.fillStyle = hurtTint;
        ctx.fillRect(x + 15, y + 16, 40, 52); // torso
        ctx.fillRect(x + 20, y - 14, 30, 30); // head

        ctx.fillStyle = "#0a1020";
        ctx.fillRect(x + 23, y - 6, 5, 5);
        ctx.fillRect(x + 42, y - 6, 5, 5);

        ctx.fillStyle = f.color;
        const frontArmX = f.facing === 1 ? x + 55 : x - 12;
        const backArmX = f.facing === 1 ? x - 8 : x + 50;

        ctx.fillRect(backArmX, y + (guardUp ? 15 : 30), 16, 16);
        ctx.fillRect(frontArmX + punchOffset, y + (guardUp ? 12 : 30), 20, 16);

        ctx.fillStyle = "#101930";
        ctx.fillRect(x + 18, y + 68, 14, 50);
        ctx.fillRect(x + 38, y + 68, 14, 50);

        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawRing();
        drawFighter(player, true);
        drawFighter(cpu, false);
      }

      function loop(ts) {
        const dt = (ts - state.lastFrame) / 1000;
        state.lastFrame = ts;

        if (!state.over) {
          state.timer = Math.max(0, state.timer - dt);
          processInput();
          cpuLogic();
          updateTimers();
          checkWin();
          updateHud();
        }

        render();
        requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (["arrowleft", "arrowright", "a", "d", "j", "k"].includes(key)) {
          e.preventDefault();
          keys.add(key);
        }
      });

      window.addEventListener("keyup", (e) => {
        keys.delete(e.key.toLowerCase());
      });

      restartBtn.addEventListener("click", resetRound);

      resetRound();
      updateHud();
      requestAnimationFrame((ts) => {
        state.lastFrame = ts;
        requestAnimationFrame(loop);
      });
    </script>
  </body>
</html>
